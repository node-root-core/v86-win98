<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Windows 98 Emulator</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        #screen_container { 
            width: 100%; 
            height: 100%; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }
    </style>
    <script src="libv86.js"></script>
</head>
<body>
    <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
        <canvas style="display: none"></canvas>
    </div>

    <script>
        "use strict";
        window.onload = function() {
            var emulator = new V86Starter({
                wasm_path: "v86.wasm",
                memory_size: 128 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: "https://raw.githubusercontent.com/copy/v86/master/bios/seabios.bin" },
                vga_bios: { url: "https://raw.githubusercontent.com/copy/v86/master/bios/vgabios.bin" },
                hda: { url: "https://copy.sh/v86/images/windows98.img" },
                autostart: true,
            });
        };
    </script>
</body>
</html>
